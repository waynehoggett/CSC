apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All namespaced controller resources are placed in claude-system.
namespace: claude-system

resources:
  - namespace.yaml
  - ../crd
  - ../rbac
  - ../manager

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: claude-sandbox-controller
